version: '3.8'

services:
  careerpulse:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: careerpulse-server
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - PORT=5000
      - HOST=0.0.0.0
      - LLM_PROVIDER=mock
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:5000/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - careerpulse-network

networks:
  careerpulse-network:
    driver: bridge
